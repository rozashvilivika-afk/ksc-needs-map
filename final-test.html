<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Финальная проверка знаний</title>

<style>
:root {
  --yellow: #ffc32e;
  --black: #242124;
  --gray: #f2f2f2;
  --green: #28a66a;
  --red: #e45c5c;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 24px;
  background: #f7f8fa;
  color: var(--black);
  font-family: Arial, sans-serif;
}

.container {
  max-width: 900px;
  margin: 0 auto;
  background: white;
  border-radius: 24px;
  padding: 42px;
  box-shadow: 0 10px 35px rgba(0,0,0,0.06);
}

.topline {
  display: inline-block;
  background: var(--yellow);
  padding: 12px 24px;
  border-radius: 8px 16px 8px 16px;
  font-size: 22px;
  font-weight: 800;
  margin-bottom: 28px;
}

h1 {
  font-size: 34px;
  margin: 0 0 12px;
}

.subtitle {
  color: #777;
  line-height: 1.6;
  margin-bottom: 30px;
}

.progress-info {
  display: flex;
  justify-content: space-between;
  font-size: 14px;
  font-weight: 700;
  margin-bottom: 10px;
}

.progress {
  width: 100%;
  height: 9px;
  background: #e9e9e9;
  border-radius: 20px;
  overflow: hidden;
  margin-bottom: 32px;
}

.progress-fill {
  height: 100%;
  width: 0%;
  background: var(--yellow);
  transition: width .35s ease;
}

.question {
  font-size: 23px;
  line-height: 1.4;
  font-weight: 800;
  margin-bottom: 24px;
}

.answers {
  display: grid;
  gap: 13px;
}

.answer {
  width: 100%;
  border: 2px solid #e6e6e6;
  background: white;
  padding: 18px 20px;
  border-radius: 15px;
  text-align: left;
  font-size: 16px;
  line-height: 1.5;
  cursor: pointer;
  color: var(--black);
  transition: .2s;
}

.answer:hover:not(:disabled) {
  border-color: var(--yellow);
  background: #fffaf0;
  transform: translateY(-2px);
}

.answer.correct {
  border-color: var(--green);
  background: #eaf8f0;
}

.answer.wrong {
  border-color: var(--red);
  background: #fff0f0;
}

.answer:disabled {
  cursor: default;
}

.feedback {
  display: none;
  margin-top: 22px;
  padding: 20px;
  border-radius: 15px;
  line-height: 1.6;
  background: #f4f4f4;
}

.feedback.show {
  display: block;
}

.feedback.good {
  border-left: 5px solid var(--green);
}

.feedback.bad {
  border-left: 5px solid var(--red);
}

.feedback strong {
  display: block;
  margin-bottom: 7px;
}

.actions {
  display: flex;
  justify-content: flex-end;
  margin-top: 28px;
}

.primary {
  background: var(--yellow);
  border: none;
  border-radius: 12px;
  padding: 16px 28px;
  font-size: 16px;
  font-weight: 800;
  cursor: pointer;
  color: var(--black);
}

.primary:hover {
  background: #f3b51e;
}

.primary:disabled {
  opacity: .4;
  cursor: not-allowed;
}

.result {
  display: none;
  text-align: center;
  padding: 25px 0;
}

.result.show {
  display: block;
}

.score {
  font-size: 72px;
  font-weight: 900;
  margin: 25px 0;
}

.result-message {
  font-size: 18px;
  line-height: 1.6;
  color: #555;
  margin-bottom: 28px;
}

.result-icon {
  font-size: 64px;
}

@media(max-width:600px) {
  body {
    padding: 10px;
  }

  .container {
    padding: 24px 18px;
    border-radius: 18px;
  }

  h1 {
    font-size: 27px;
  }

  .question {
    font-size: 20px;
  }

  .answer {
    font-size: 15px;
    padding: 15px;
  }
}
</style>
</head>

<body>

<div class="container">

  <div class="topline">Финальная проверка</div>

  <div id="quiz">
    <h1>Проверим, как ты

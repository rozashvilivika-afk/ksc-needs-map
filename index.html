
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Карта выявления потребностей KSC</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 20px;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg,#eaf6ff,#ffffff);
  color: #102b85;
}

.app {
  max-width: 1250px;
  margin: auto;
}

h1 {
  text-align: center;
  margin: 8px 0 20px;
}

.subtitle {
  text-align: center;
  color: #45618f;
  margin-bottom: 22px;
}

.layout {
  display: grid;
  grid-template-columns: 1fr 340px;
  gap: 18px;
  align-items: start;
}

.map {
  position: relative;
  width: 100%;
  border-radius: 18px;
  overflow: hidden;
  box-shadow: 0 8px 30px #193f7620;
  background: white;
}

.map img.base {
  display: block;
  width: 100%;
  height: auto;
}

.hotspot {
  position: absolute;
  border: 2px solid transparent;
  background: transparent;
  border-radius: 18px;
  cursor: pointer;
  transition: .2s;
}

.hotspot:hover,
.hotspot.active {
  border-color: #1685ff;
  background: #1685ff18;
  box-shadow: 0 0 0 3px #1685ff35;
}

.panel {
  background: white;
  border: 1px solid #d9eaff;
  border-radius: 20px;
  padding: 18px;
  box-shadow: 0 8px 28px #193f7618;
  position: sticky;
  top: 15px;
}

.panel-head {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 12px;
}

.number {
  width: 42px;
  height: 42px;
  background: #087cf5;
  color: white;
  border-radius: 50%;
  display: grid;
  place-items: center;
  font-size: 21px;
  font-weight: bold;
  flex-shrink: 0;
}

.panel h2 {
  font-size: 21px;
  margin: 0;
}

.question {
  color: #173b8c;
  font-size: 17px;
  line-height: 1.4;
  margin: 10px 0 15px;
}

.character {
  min-height: 210px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #edf7ff;
  border-radius: 14px;
  margin-bottom: 14px;
  overflow: hidden;
}

.character img {
  width: 100%;
  max-height: 250px;
  object-fit: contain;
}

.question-list {
  display: grid;
  gap: 8px;
}

.question-item {
  border: 1px solid #d9eaff;
  background: #f2f8ff;
  border-radius: 10px;
  padding: 11px;
  color: #17428e;
  cursor: pointer;
  text-align: left;
  font-size: 14px;
  line-height: 1.35;
}

.question-item:hover,
.question-item.selected {
  background: #dceeff;
  border-color: #1685ff;
}

.controls {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin-top: 15px;
}

button.action {
  border: 0;
  border-radius: 25px;
  padding: 12px 16px;
  cursor: pointer;
  font-weight: bold;
  background: #087cf5;
  color: white;
}

button.secondary {
  background: #eef5ff;
  color: #17428e;
}

button:focus-visible {
  outline: 3px solid #ffbf47;
  outline-offset: 3px;
}

.footer {
  text-align: center;
  margin: 18px 0;
  color: #173b8c;
  font-size: 14px;
}

@media(max-width: 850px) {
  .layout { grid-template-columns: 1fr; }
  .panel { position: static; }
}

@media(max-width: 520px) {
  body { padding: 8px; }
  .panel { padding: 13px; }
  .panel h2 { font-size: 18px; }
}
</style>
</head>

<body>
<div class="app">
  <h1>Карта выявления потребностей</h1>
  <div class="subtitle">
    Выберите этап, чтобы изучить вопросы менеджера
  </div>

  <div class="layout">
    <div class="map">
      <img class="base"
        src="Интерактивная карта выявления потребностей (1).png"
        alt="Карта выявления потребностей клиента">

      <button class="hotspot" style="left:36%;top:3%;width:24%;height:18%"
        onclick="selectStep(0)" aria-label="Задача"></button>

      <button class="hotspot" style="left:64%;top:7%;width:32%;height:19%"
        onclick="selectStep(1)" aria-label="Контекст"></button>

      <button class="hotspot" style="left:69%;top:30%;width:28%;height:18%"
        onclick="selectStep(2)" aria-label="Параметры"></button>

      <button class="hotspot" style="left:69%;top:52%;width:29%;height:17%"
        onclick="selectStep(3)" aria-label="Ограничения"></button>

      <button class="hotspot" style="left:13%;top:69%;width:25%;height:17%"
        onclick="selectStep(4)" aria-label="Сроки"></button>

      <button class="hotspot" style="left:10%;top:48%;width:28%;height:17%"
        onclick="selectStep(5)" aria-label="Условия покупки"></button>

      <button class="hotspot" style="left:23%;top:29%;width:23%;height:17%"
        onclick="selectStep(6)" aria-label="Принятие решения"></button>
    </div>

    <section class="panel" aria-live="polite">
      <div class="panel-head">
        <div class="number" id="stepNumber">1</div>
        <h2 id="stepTitle">Задача</h2>
      </div>

      <div class="question" id="stepDescription">
        Что клиент хочет решить?
      </div>

      <div class="character">
        <img id="characterImage" src="pose_1.png" alt="Девушка-консультант">
      </div>

      <div class="question-list" id="questionList"></div>

      <div class="controls">
        <button class="action secondary" onclick="previousStep()">Назад</button>
        <button class="action" onclick="nextStep()">Следующий этап →</button>
      </div>

      <div class="controls">
        <button class="action secondary" onclick="restart()">Начать заново ↺</button>
        <span id="progress">1 / 7</span>
      </div>
    </section>
  </div>

  <div class="footer">
    Наша задача не собрать максимум информации, а понять, что поможет подобрать подходящее решение.
  </div>
</div>

<script>
const steps = [
  {
    title: "Задача",
    description: "Что клиент хочет решить?",
    questions: [
      "Для чего вы подбираете мебель?",
      "Что именно хотите обустроить?",
      "Какой результат для вас будет идеальным?",
      "Что сейчас не устраивает в имеющемся решении?"
    ]
  },
  {
    title: "Контекст",
    description: "Где и как будет использоваться мебель?",
    questions: [
      "Где планируете использовать мебель?",
      "Это частное или коммерческое использование?",
      "Какие условия эксплуатации?",
      "Какой стиль и окружение?"
    ]
  },
  {
    title: "Параметры",
    description: "Какие характеристики действительно важны?",
    questions: [
      "На какое количество человек рассчитываете?",
      "Какие размеры или габариты подходят?",
      "Какие материалы и цвета рассматриваете?",
      "Что для вас важнее всего в характеристиках?"
    ]
  },
  {
    title: "Ограничения",
    description: "Что может повлиять на выбор?",
    questions: [
      "Есть ли ограничения по месту установки?",
      "Какие размеры нельзя превышать?",
      "Есть ли особые требования к материалу?",
      "Что точно не подойдёт?"
    ]
  },
  {
    title: "Сроки",
    description: "Когда продукт нужен?",
    questions: [
      "К какой дате нужна мебель?",
      "Есть ли привязка к событию или открытию сезона?",
      "Рассматриваете готовые позиции или готовы ждать изготовление?",
      "Насколько критично соблюдение срока?"
    ]
  },
  {
    title: "Условия покупки",
    description: "Объём, бюджет, доставка, оплата.",
    questions: [
      "Какой объём планируете приобрести?",
      "На какой бюджет ориентируетесь?",
      "Нужна ли доставка?",
      "Какой способ оплаты удобен?"
    ]
  },
  {
    title: "Принятие решения",
    description: "Кто выбирает, согласовывает и принимает решение?",
    questions: [
      "Кто будет участвовать в выборе?",
      "Нужно ли с кем-то согласовать предложение?",
      "По каким критериям будете сравнивать варианты?",
      "Что поможет вам принять решение?"
    ]
  }
];

let currentStep = 0;
let selectedQuestion = -1;

function render() {
  const step = steps[currentStep];

  document.getElementById("stepNumber").textContent = currentStep + 1;
  document.getElementById("stepTitle").textContent = step.title;
  document.getElementById("stepDescription").textContent = step.description;
  document.getElementById("characterImage").src =
    "pose_" + (currentStep + 1) + ".png";
  document.getElementById("progress").textContent =
    (currentStep + 1) + " / " + steps.length;

  document.querySelectorAll(".hotspot").forEach((button, index) => {
    button.classList.toggle("active", index === currentStep);
  });

  const list = document.getElementById("questionList");
  list.innerHTML = "";

  step.questions.forEach((question, index) => {
    const button = document.createElement("button");
    button.className = "question-item" +
      (selectedQuestion === index ? " selected" : "");
    button.textContent = "💬 " + question;

    button.onclick = () => {
      selectedQuestion = index;
      render();
    };

    list.appendChild(button);
  });
}

function selectStep(index) {
  currentStep = index;
  selectedQuestion = -1;
  render();
}

function nextStep() {
  currentStep = (currentStep + 1) % steps.length;
  selectedQuestion = -1;
  render();
}

function previousStep() {
  currentStep = (currentStep - 1 + steps.length) % steps.length;
  selectedQuestion = -1;
  render();
}

function restart() {
  currentStep = 0;
  selectedQuestion = -1;
  render();
}

render();
</script>
</body>
</html>

<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Интерактив — ёмкости KSC</title>
<style>
  * {
    box-sizing: border-box;
  }
  html, body {
    margin: 0;
    padding: 0;
    background: #ffffff;
    font-family: Arial, Helvetica, sans-serif;
  }
  .interactive {
    position: relative;
    width: 100%;
    max-width: 1916px;
    margin: 0 auto;
    background: #ffffff;
    user-select: none;
  }
  .interactive img {
    display: block;
    width: 100%;
    height: auto;
  }
  .tank-hotspot {
    position: absolute;
    border: 0;
    background: transparent;
    padding: 0;
    cursor: pointer;
    outline: none;
  }
  .volume-label {
    position: absolute;
    left: 50%;
    top: -12px;
    transform: translate(-50%, -100%) scale(.96);
    padding: 10px 16px;
    border-radius: 999px;
    background: rgba(255,255,255,.98);
    color: #0b7f90;
    font-size: clamp(13px, 1.35vw, 24px);
    font-weight: 800;
    line-height: 1;
    white-space: nowrap;
    box-shadow: 0 8px 24px rgba(0,0,0,.12);
    opacity: 0;
    pointer-events: none;
    transition: opacity .18s ease, transform .18s ease;
  }
  .volume-label::after {
    content: "";
    position: absolute;
    left: 50%;
    bottom: -7px;
    transform: translateX(-50%);
    width: 0;
    height: 0;
    border-left: 7px solid transparent;
    border-right: 7px solid transparent;
    border-top: 7px solid rgba(255,255,255,.98);
  }
  .tank-hotspot:hover .volume-label,
  .tank-hotspot:focus-visible .volume-label,
  .tank-hotspot.active .volume-label {
    opacity: 1;
    transform: translate(-50%, -100%) scale(1);
  }
  .tank-hotspot:focus-visible {
    outline: 3px solid rgba(11,127,144,.35);
    outline-offset: 2px;
    border-radius: 14px;
  }
  @media (max-width: 720px) {
    .volume-label {
      top: -6px;
      padding: 8px 10px;
      font-size: 12px;
    }
  }
</style>
</head>

<script>
(() => {
  const root = document.getElementById('kscInteractive');
  const hotspots = [...root.querySelectorAll('.tank-hotspot')];

  hotspots.forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const wasActive = btn.classList.contains('active');
      hotspots.forEach(h => h.classList.remove('active'));
      if (!wasActive) btn.classList.add('active');
    });
  });

  root.addEventListener('click', (e) => {
    if (!e.target.closest('.tank-hotspot')) {
      hotspots.forEach(h => h.classList.remove('active'));
    }
  });
})();
</script>

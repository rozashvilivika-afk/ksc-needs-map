<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ёмкости KSC — объёмы</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#fff;font-family:Arial,Helvetica,sans-serif}
.wrap{position:relative;width:100%;max-width:1000px;margin:0 auto;background:#fff;overflow:visible}
.wrap img{display:block;width:100%;height:auto}
.tank{position:absolute;border:0;background:transparent;padding:0;cursor:pointer;outline:none}
.tank span{position:absolute;left:50%;top:-10px;transform:translate(-50%,-100%) scale(.96);background:#fff;color:#0b7f90;font-weight:800;font-size:clamp(13px,1.8vw,24px);line-height:1;padding:9px 14px;border-radius:999px;white-space:nowrap;box-shadow:0 8px 22px rgba(0,0,0,.12);opacity:0;pointer-events:none;transition:.16s ease}
.tank span:after{content:"";position:absolute;left:50%;bottom:-7px;transform:translateX(-50%);border-left:7px solid transparent;border-right:7px solid transparent;border-top:7px solid #fff}
.tank:hover span,.tank:focus-visible span,.tank.active span{opacity:1;transform:translate(-50%,-100%) scale(1)}
.tank:focus-visible{outline:3px solid rgba(11,127,144,.32);outline-offset:2px;border-radius:14px}
@media(max-width:700px){.tank span{font-size:12px;padding:7px 9px;top:-4px}}
</style>
</head>
<body>
<div class="wrap" id="app">
<img alt="Линейка ёмкостей KSC" src="./tanks.webp">
<button class="tank" type="button" style="left:2.8%;top:56%;width:6.5%;height:22.5%" aria-label="Ёмкость 300 л"><span>300 л</span></button>
<button class="tank" type="button" style="left:10%;top:46%;width:8%;height:31.5%" aria-label="Ёмкость 500 л"><span>500 л</span></button>
<button class="tank" type="button" style="left:19.2%;top:39.5%;width:7.2%;height:38%" aria-label="Ёмкость 750 л"><span>750 л</span></button>
<button class="tank" type="button" style="left:28.5%;top:45%;width:10%;height:32.5%" aria-label="Ёмкость 1000 л"><span>1000 л</span></button>
<button class="tank" type="button" style="left:40.5%;top:38%;width:11.5%;height:39.5%" aria-label="Ёмкость 2000 л"><span>2000 л</span></button>
<button class="tank" type="button" style="left:53.2%;top:33%;width:12.8%;height:44.5%" aria-label="Ёмкость 3000 л"><span>3000 л</span></button>
<button class="tank" type="button" style="left:66.5%;top:28%;width:14.3%;height:49.5%" aria-label="Ёмкость 5000 л"><span>5000 л</span></button>
<button class="tank" type="button" style="left:80.2%;top:20%;width:16.8%;height:57.5%" aria-label="Ёмкость 10000 л"><span>10000 л</span></button>
</div>
<script>
(()=>{const root=document.getElementById('app'),tanks=[...root.querySelectorAll('.tank')];tanks.forEach(t=>t.addEventListener('click',e=>{e.stopPropagation();const a=t.classList.contains('active');tanks.forEach(x=>x.classList.remove('active'));if(!a)t.classList.add('active')}));root.addEventListener('click',e=>{if(!e.target.closest('.tank'))tanks.forEach(x=>x.classList.remove('active'))})})();
</script>
</body>
</html>

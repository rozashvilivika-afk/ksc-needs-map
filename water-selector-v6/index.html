<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#fff;color:#17324f}
.wrap{max-width:1100px;margin:0 auto;padding:18px}

.nav{width:46px;height:46px;border-radius:50%;font-size:22px;background:#eef5fb;color:#0d5fa7}
.opt{padding:11px 16px;border-radius:999px;background:#f2f6fa;color:#0d5fa7}
.opt.active{background:#0d5fa7;color:#fff}
.lens{position:absolute;width:220px;height:220px;border-radius:50%;border:4px solid #fff;box-shadow:0 8px 28px rgba(0,0,0,.22),0 0 0 2px #1483d8;background-repeat:no-repeat;background-color:#fff;pointer-events:none;display:none;z-index:5}

</style></head>

const labels=['3000 л','5000 л','15000 л'];
const disc=document.getElementById('disc'),badge=document.getElementById('badge'),stage=document.getElementById('stage'),lens=document.getElementById('lens'),opts=[...document.querySelectorAll('.opt')];
let i=0,startX=null;
function setState(n,dir=1){i=(n+states.length)%states.length;disc.style.opacity='.3';disc.style.transform=`rotate(${dir*2}deg) scale(.99)`;setTimeout(()=>{disc.src=states[i];disc.onload=()=>{disc.style.opacity='1';disc.style.transform='rotate(0deg) scale(1)'}},70);badge.textContent=`${labels[i]} · ${i+1} из 3`;opts.forEach((b,k)=>b.classList.toggle('active',k===i));lens.style.backgroundImage=`url('${states[i]}')`;}
opts.forEach(b=>b.addEventListener('click',()=>setState(+b.dataset.i,+b.dataset.i>=i?1:-1)));document.getElementById('prev').onclick=()=>setState(i-1,-1);document.getElementById('next').onclick=()=>setState(i+1,1);
function moveLens(e){const r=stage.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;if(x<0||y<0||x>r.width||y>r.height)return;const s=2.35,w=lens.offsetWidth,h=lens.offsetHeight;let lx=x-w/2,ly=y-h/2;lx=Math.max(0,Math.min(r.width-w,lx));ly=Math.max(0,Math.min(r.height-h,ly));lens.style.left=lx+'px';lens.style.top=ly+'px';lens.style.display='block';lens.style.backgroundSize=`${r.width*s}px ${r.height*s}px`;lens.style.backgroundPosition=`${-(x*s-w/2)}px ${-(y*s-h/2)}px`;}
stage.addEventListener('mousemove',moveLens);stage.addEventListener('mouseleave',()=>lens.style.display='none');stage.addEventListener('touchstart',e=>{if(e.touches[0])moveLens(e.touches[0])},{passive:true});stage.addEventListener('touchmove',e=>{if(e.touches[0])moveLens(e.touches[0])},{passive:true});stage.addEventListener('touchend',()=>lens.style.display='none');
stage.addEventListener('pointerdown',e=>{startX=e.clientX});stage.addEventListener('pointerup',e=>{if(startX===null)return;let d=e.clientX-startX;if(Math.abs(d)>45)setState(i+(d<0?1:-1),d<0?1:-1);startX=null});
setState(0,1);
</script></body></html>
